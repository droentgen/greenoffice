# Let .htaccess files under public/ (e.g. public/uploads/.htaccess) take effect,
# and enforce the "never execute uploaded files" rule at the main-config level too
# (defense in depth, independent of AllowOverride).
<Directory /var/www/html/public>
    AllowOverride All
    # index.php (the real, data-driven home page) must win over the static
    # public/index.html preview file that also lives in this folder.
    DirectoryIndex index.php index.html
</Directory>

<Directory /var/www/html/public/uploads>
    <FilesMatch "\.(php|phtml|php\d|phar|pl|py|cgi|sh)$">
        Require all denied
    </FilesMatch>
    php_flag engine off
    Options -Indexes
</Directory>
