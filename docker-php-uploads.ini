; PHP's own caps must allow at least as much as config.php's 'upload_max_mb',
; or a file under that limit can still get silently rejected before app code
; ever sees it. post_max_size is kept a bit above upload_max_filesize to leave
; room for the rest of the multipart form (CSRF token, other fields).
upload_max_filesize = 10M
post_max_size = 12M
